<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Energy: lightning bolt with sun-like rays -->
  <defs>
    <radialGradient id="energyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDAA22" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#DDAA22" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background glow -->
  <circle cx="32" cy="32" r="28" fill="url(#energyGlow)"/>
  <!-- Short rays -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="#DDAA22" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="50" x2="32" y2="60" stroke="#DDAA22" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="4" y1="32" x2="14" y2="32" stroke="#DDAA22" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="32" x2="60" y2="32" stroke="#DDAA22" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="12" y1="12" x2="18" y2="18" stroke="#DDAA22" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="46" y1="12" x2="40" y2="18" stroke="#DDAA22" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="12" y1="52" x2="18" y2="46" stroke="#DDAA22" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="46" y1="52" x2="40" y2="46" stroke="#DDAA22" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Lightning bolt -->
  <polygon points="36,6 22,30 30,30 20,58 46,28 36,28 44,6" fill="#DDAA22"/>
  <!-- Lightning bolt inner highlight -->
  <polygon points="36,12 26,30 32,30 24,52 42,28 36,28 42,12" fill="#EEBB44" opacity="0.6"/>
</svg>