<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Explorer: colonial figure with hat and pack -->
  <!-- Wide-brimmed hat -->
  <ellipse cx="32" cy="16" rx="14" ry="4" fill="#CC4444"/>
  <rect x="26" y="8" width="12" height="8" rx="2" fill="#CC4444"/>
  <!-- Head -->
  <circle cx="32" cy="20" r="6" fill="#CC4444"/>
  <!-- Body -->
  <rect x="27" y="26" width="10" height="16" rx="2" fill="#CC4444"/>
  <!-- Pack on back -->
  <rect x="37" y="26" width="6" height="10" rx="1" fill="#AA3333"/>
  <!-- Legs -->
  <rect x="28" y="42" width="4" height="12" rx="1" fill="#CC4444"/>
  <rect x="34" y="42" width="4" height="12" rx="1" fill="#CC4444"/>
  <!-- Arms -->
  <rect x="22" y="28" width="5" height="3" rx="1" fill="#CC4444"/>
  <!-- Walking stick -->
  <line x1="24" y1="28" x2="20" y2="54" stroke="#AA3333" stroke-width="2" stroke-linecap="round"/>
</svg>