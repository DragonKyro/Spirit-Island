<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- City: 2-3 buildings of varied heights -->
  <!-- Tall building (left-center) -->
  <rect x="8" y="12" width="16" height="44" fill="#CC4444"/>
  <rect x="10" y="16" width="4" height="4" rx="0.5" fill="#882222"/>
  <rect x="18" y="16" width="4" height="4" rx="0.5" fill="#882222"/>
  <rect x="10" y="24" width="4" height="4" rx="0.5" fill="#882222"/>
  <rect x="18" y="24" width="4" height="4" rx="0.5" fill="#882222"/>
  <rect x="10" y="32" width="4" height="4" rx="0.5" fill="#882222"/>
  <rect x="18" y="32" width="4" height="4" rx="0.5" fill="#882222"/>
  <!-- Medium building (center-right) -->
  <rect x="26" y="24" width="16" height="32" fill="#BB3333"/>
  <rect x="29" y="28" width="4" height="4" rx="0.5" fill="#882222"/>
  <rect x="35" y="28" width="4" height="4" rx="0.5" fill="#882222"/>
  <rect x="29" y="36" width="4" height="4" rx="0.5" fill="#882222"/>
  <rect x="35" y="36" width="4" height="4" rx="0.5" fill="#882222"/>
  <!-- Peaked roof on medium building -->
  <polygon points="26,24 34,16 42,24" fill="#AA3333"/>
  <!-- Short building (right) -->
  <rect x="44" y="36" width="14" height="20" fill="#CC4444"/>
  <rect x="47" y="40" width="4" height="4" rx="0.5" fill="#882222"/>
  <rect x="47" y="48" width="8" height="8" rx="0.5" fill="#882222"/>
  <!-- Base line -->
  <line x1="4" y1="56" x2="60" y2="56" stroke="#AA3333" stroke-width="2"/>
</svg>