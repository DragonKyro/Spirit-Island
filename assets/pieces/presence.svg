<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Glow filter -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#99BBDD" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6699CC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6699CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#AACCEE"/>
      <stop offset="60%" stop-color="#6699CC"/>
      <stop offset="100%" stop-color="#4477AA"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <!-- Mid glow ring -->
  <circle cx="32" cy="32" r="20" fill="#6699CC" opacity="0.3"/>
  <!-- Main spirit orb -->
  <circle cx="32" cy="32" r="14" fill="url(#orb)"/>
  <!-- Inner highlight -->
  <circle cx="28" cy="28" r="5" fill="#BBDDFF" opacity="0.6"/>
  <!-- Subtle sparkle lines -->
  <line x1="32" y1="4" x2="32" y2="12" stroke="#6699CC" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="60" stroke="#6699CC" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="12" y2="32" stroke="#6699CC" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="60" y2="32" stroke="#6699CC" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
</svg>