<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Town: simple house with peaked roof -->
  <!-- Main building -->
  <rect x="14" y="32" width="36" height="24" fill="#CC4444"/>
  <!-- Peaked roof -->
  <polygon points="10,32 32,12 54,32" fill="#AA3333"/>
  <!-- Door -->
  <rect x="27" y="42" width="10" height="14" rx="1" fill="#882222"/>
  <!-- Window left -->
  <rect x="17" y="37" width="7" height="7" rx="1" fill="#882222"/>
  <!-- Window right -->
  <rect x="40" y="37" width="7" height="7" rx="1" fill="#882222"/>
  <!-- Chimney -->
  <rect x="40" y="10" width="6" height="14" fill="#AA3333"/>
</svg>